// PATTY AND SELMA — 8 sub-tasks
const PATTY_QS = [
  {
    id: 'p1', mtqId: 'patty', mtqName: '10 — Patty and Selma',
    taskLabel: 'Task 1 (a) — Consolidated Revenue ($\'000)',
    scenario: SCENARIOS.patty, type: 'numeric', unit: "$'000",
    text: "Calculate the REVENUE figure for the consolidated statement of profit or loss for the year ended 31 December 20X1.",
    answer: 1245, tolerance: 0, answerDisplay: "$1,245,000",
    solution: `Step 1 — Identify post-acquisition period for Selma
Patty acquired 70% Selma on 1 May 20X1.
Year-end 31 Dec 20X1.
Months in post-acq period: May, Jun, Jul, Aug, Sep, Oct, Nov, Dec = 8 months.
Time-apportion fraction = 8/12.

Step 2 — Patty's revenue: taken in FULL
$987,000 (Patty existed for the full year)

Step 3 — Selma's revenue: time-apportioned (post-acq only)
$567 × 8/12 = $378,000

Step 4 — Eliminate intercompany sale
Patty sold $120,000 to Selma. From the group's view, this is an internal transfer — not a real sale to the outside world.
Cancel from revenue: − $120,000

Step 5 — Combine
$987 + $378 − $120 = $1,245,000`,
    explanation: `THREE adjustments stack in every mid-year consolidated revenue calculation:

1. PARENT'S REVENUE — taken IN FULL.
The parent existed all year, so 100% of its revenue is consolidated. Don't time-apportion the parent — this is a common rookie error.

2. SUBSIDIARY'S REVENUE — TIME-APPORTIONED.
The group only owns the subsidiary from the acquisition date. Anything earned before that date belongs to the previous owners, not the group. With "accrues evenly" assumed, multiply by (months post-acq / 12).

In Patty's case: 4 months pre-acq (Jan-Apr) belongs to old Selma shareholders. 8 months post-acq (May-Dec) belongs to the group. So only 8/12 × $567 = $378k flows into consolidated revenue.

3. INTERCOMPANY ELIMINATION.
$120k Patty→Selma sale is an internal transfer. From the group's perspective, it's like moving money from one pocket to another. Cancel from revenue (and the matching $120 from COS — see next sub-task).

KEY INSIGHT — why the intercompany happens in post-acq period:
Patty couldn't have sold to Selma BEFORE acquiring Selma (they weren't related parties yet). So the full $120k intercompany sale necessarily happened in the post-acq period and the full $120k cancels.

Final formula: Parent's full revenue + Sub's post-acq revenue − intercompany sales`,
    trap: `THREE common traps:

1. FORGETTING TO TIME-APPORTION SELMA: $987 + $567 − $120 = $1,434 ❌
This includes 4 months of Selma's pre-acquisition revenue, which doesn't belong to the group.

2. TIME-APPORTIONING PATTY: ($987 × 8/12) + ($567 × 8/12) − $120 = $916 ❌
Only the SUBSIDIARY gets time-apportioned. Parent ALWAYS full year.

3. FORGETTING INTERCOMPANY: $987 + $378 = $1,365 ❌
The $120k must cancel. If you missed this, double-check your COS calculation too — they must cancel together.

MEMORY AID: "PARENT FULL · SUB POST-ACQ · MINUS INTER-CO"`
  },
  {
    id: 'p2', mtqId: 'patty', mtqName: '10 — Patty and Selma',
    taskLabel: 'Task 1 (b) — Cost of sales (formula MCQ)',
    scenario: SCENARIOS.patty, type: 'mcq',
    text: "Select the correct calculation for the cost of sales line of the consolidated P&L (all figures in $'000).",
    options: [
      { label: 'A', text: "$564 + ($336 × 8/12) − $120 − $5" },
      { label: 'B', text: "$564 + ($336 × 8/12) + $120 − $5" },
      { label: 'C', text: "$564 + ($336 × 8/12) − $120 + $5" }
    ],
    answer: 'C',
    solution: `Correct formula: Patty's COS + Selma's post-acq COS − intercompany sale + URP
= $564 + ($336 × 8/12) − $120 + $5
= $564 + $224 − $120 + $5
= $673,000

Breakdown of each piece:

Step 1 — Patty's COS: $564 (full year)

Step 2 — Selma's post-acq COS: $336 × 8/12 = $224
(only May-Dec belongs to the group)

Step 3 — Intercompany sale: subtract $120
The $120 sale was in Patty's revenue AND in Selma's COS (Selma bought the goods, so the cost appears there). Cancel both sides.

Step 4 — URP adjustment: ADD $5

URP working:
- Mark-up on cost 20% → profit fraction of SALE = 20/120 = 1/6
- Profit on sale of $120 = $120 × 1/6 = $20
- Unsold portion = 1/4 (one quarter still in inventory)
- URP = $20 × 1/4 = $5`,
    explanation: `URP IN COST OF SALES — why ADD, not subtract:

When Patty sold $120 to Selma (cost $100, profit $20), Patty recorded:
• Revenue $120 (Dr Bank/Receivable, Cr Revenue)
• COS $100 (Dr COS, Cr Inventory)
Patty's books show GP of $20 on this sale.

If Selma sells those goods on to customers, the $20 is realised group profit — fine. But if some goods are STILL IN SELMA'S INVENTORY, the group hasn't actually sold them to anyone external. The $20 profit on the unsold portion is unrealised.

¼ of the goods are unsold → $20 × ¼ = $5 of profit is unrealised at year-end.

To correct the group P&L:
We need to REDUCE group gross profit by $5.
ADD $5 to COS → COS increases by $5 → Gross profit falls by $5 ✓

Equivalent SOFP correction:
Reduce inventory by $5 (because the inventory sitting in Selma's books is overstated at the marked-up price). This becomes: Dr COS $5, Cr Inventory $5.

The two adjustments are mirror images:
+ URP to COS (in P&L)
− URP from Inventory (in SOFP)
Both reduce group net assets by the same $5.

WHY OPTION A IS WRONG:
"− $5" would REDUCE COS, which INCREASES gross profit. This is the opposite of what URP does. URP must always REDUCE group gross profit by the unrealised amount.

WHY OPTION B IS WRONG:
"+ $120" instead of "− $120" doesn't make sense — you'd be adding the intercompany sale back into COS, which makes group COS too high.`,
    trap: `THE SIGN TRAP IS THE KILLER:

Revenue: − intercompany (subtract)
COS: − intercompany (subtract) AND + URP (add)

Don't confuse these signs! The four-step rhythm for any P&L line where intercompany trade exists:
1. Add the two companies' figures (with sub time-apportioned)
2. Subtract the intercompany flow (both revenue AND COS)
3. Add URP to COS only (this reduces group GP)
4. Net effect on group GP: down by URP ($5 here)

MARK-UP vs MARGIN TRAP:
"Mark-up on cost 20%" → profit/cost = 20/100 → profit/SALE = 20/120 = 1/6
"Margin of 20%" → profit/SALE = 20/100 = 1/5

If you'd misread "mark-up on cost" as "margin", URP = $120 × 1/5 × 1/4 = $6 (not $5). 
Always re-read the URP wording. "On cost" = mark-up. "Of sale" / "margin" = different fraction.`
  },

    explanation: `Below gross profit, every consolidated P&L line follows the same pattern:

PARENT'S FULL YEAR + SUBSIDIARY'S POST-ACQ FRACTION

For Selma's lines, the post-acq fraction is always 8/12 (consistent throughout the year because items accrue evenly).

const STORAGE_KEY = 'consolidation_mtq_state_v1';
let state = { screen: 'start', currentIndex: 0, answers: {}, openResultId: null, openScenarios: {} };

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) state = Object.assign({}, state, JSON.parse(saved));
  } catch(e) {}
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}
function resetTest() {
  if (!confirm('This will erase your saved progress and answers. Start over?')) return;
  state = { screen: 'start', currentIndex: 0, answers: {}, openResultId: null, openScenarios: {} };
  saveState();
  render();
}

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];});
}

function formatText(text) {
  const blocks = text.split(/\n\n+/);
  return blocks.map(function(block){
    const hasMultiSpace = /  +/.test(block);
    const hasNewlines = block.includes('\n');
    const hasDollarsOrDigits = /[\$\d]/.test(block);
    const looksTabular = hasMultiSpace && hasNewlines && hasDollarsOrDigits;
    const heavyDollars = (block.match(/\$/g) || []).length >= 3 && hasNewlines;
    if (looksTabular || heavyDollars) {
      return '<div class="q-data">' + escapeHTML(block) + '</div>';
    }
    return '<p style="margin: 0 0 12px;">' + escapeHTML(block).replace(/\n/g, '<br>') + '</p>';
  }).join('');
}

function render() {
  const app = document.getElementById('app');
  if (state.screen === 'start') renderStart(app);
  else if (state.screen === 'question') renderQuestion(app);
  else if (state.screen === 'results') renderResults(app);
}

function renderStart(app) {
  const answeredCount = Object.keys(state.answers).length;
  const hasProgress = answeredCount > 0;
  app.innerHTML = `
    <header class="banner">
      <h1>Consolidation MTQ Test</h1>
      <div class="sub">ACCA Financial Accounting · 7 multi-task scenarios · ${QUESTIONS.length} sub-tasks · No timer · Save progress</div>
    </header>
    <div class="card start-screen">
      <h2>${hasProgress ? 'Resume Test' : 'Start Test'}</h2>
      <p>
        ${hasProgress
          ? `You've answered <strong>${answeredCount} of ${QUESTIONS.length}</strong> sub-tasks. Continue where you left off?`
          : `7 multi-task scenarios (Patty, Pentagon, Pike, Plate, Port, Hide, Push) broken into ${QUESTIONS.length} sub-tasks. Each sub-task on its own screen.`
        }
      </p>
      <p style="font-size:14px; color: var(--text-muted);">
        Click an option, type a number, or pick true/false. Click "Next" to move on. Scenario stays at the top of each sub-task (click to expand).<br>
        No instant feedback — full results with step-by-step tutor explanations appear at the end.<br>
        Progress saves automatically.
      </p>
      <div style="margin-top: 30px;">
        <button class="nav-btn primary" onclick="startTest()">${hasProgress ? 'Resume Test' : 'Start Test'}</button>
        ${hasProgress ? '<button class="nav-btn danger" onclick="resetTest()" style="margin-left:10px;">Start Over</button>' : ''}
      </div>
    </div>
  `;
}

function startTest() {
  let firstUnanswered = 0;
  for (let i = 0; i < QUESTIONS.length; i++) {
    if (state.answers[QUESTIONS[i].id] === undefined) { firstUnanswered = i; break; }
    if (i === QUESTIONS.length - 1) firstUnanswered = i;
  }
  state.currentIndex = firstUnanswered;
  state.screen = 'question';
  saveState();
  render();
}

function renderQuestion(app) {
  const q = QUESTIONS[state.currentIndex];
  const progress = ((state.currentIndex + 1) / QUESTIONS.length) * 100;
  const currentAnswer = state.answers[q.id];
  const scenarioOpenManual = state.openScenarios[q.mtqId + ':' + state.currentIndex];
  const isFirstOfMtq = state.currentIndex === 0 || QUESTIONS[state.currentIndex - 1].mtqId !== q.mtqId;
  const scenarioOpen = scenarioOpenManual !== undefined ? scenarioOpenManual : isFirstOfMtq;

  let optionsHTML = '';
  if (q.type === 'mcq') {
    optionsHTML = '<div class="options">' + q.options.map(function(opt){
      return '<button class="option ' + (currentAnswer === opt.label ? 'selected' : '') + '" onclick="selectAnswer(\'' + opt.label + '\')">' +
        '<span class="option-letter">' + opt.label + '</span>' +
        '<span class="option-text">' + escapeHTML(opt.text).replace(/\n/g, '<br>') + '</span>' +
        '</button>';
    }).join('') + '</div>';
  } else if (q.type === 'tf') {
    optionsHTML = '<div class="tf-grid">' +
      '<button class="option ' + (currentAnswer === 'T' ? 'selected' : '') + '" onclick="selectAnswer(\'T\')"><span class="option-letter">T</span><span class="option-text">True</span></button>' +
      '<button class="option ' + (currentAnswer === 'F' ? 'selected' : '') + '" onclick="selectAnswer(\'F\')"><span class="option-letter">F</span><span class="option-text">False</span></button>' +
      '</div>';
  } else if (q.type === 'numeric') {
    const val = currentAnswer !== undefined ? currentAnswer : '';
    const unit = q.unit || '$';
    optionsHTML = '<div class="numeric-input-wrap">' +
      '<label>Answer (' + escapeHTML(unit) + '):</label>' +
      '<input type="number" step="any" class="numeric-input" id="numeric-' + q.id + '" value="' + val + '" oninput="setNumericAnswer(this.value)" placeholder="Enter answer" autocomplete="off">' +
      '</div>';
  }

  const isLast = state.currentIndex === QUESTIONS.length - 1;

  app.innerHTML = `
    <header class="banner">
      <h1>Consolidation MTQ Test</h1>
      <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
      <div class="progress-text">
        <span>Sub-task ${state.currentIndex + 1} of ${QUESTIONS.length}</span>
        <span>${Object.keys(state.answers).length} answered</span>
      </div>
    </header>
    <div class="card">
      <div class="scenario-box ${scenarioOpen ? 'open' : ''}">
        <button class="scenario-toggle" onclick="toggleScenario('${q.mtqId}', ${state.currentIndex})">
          <span class="mtq-pill">${q.mtqName}</span>
          <span class="chev">▶</span>
          <span style="color: var(--text-muted); font-weight: 400;">Scenario ${scenarioOpen ? '(click to collapse)' : '(click to expand)'}</span>
        </button>
        <div class="scenario-content">
          ${formatText(q.scenario)}
        </div>
      </div>
      <div class="q-task-label">${escapeHTML(q.taskLabel)}</div>
      <div class="q-text">${formatText(q.text)}</div>
      ${optionsHTML}
      <div class="actions">
        <button class="nav-btn" onclick="prevQ()" ${state.currentIndex === 0 ? 'disabled' : ''}>← Previous</button>
        ${isLast ? '<button class="nav-btn primary" onclick="submitTest()">Submit Test →</button>' : '<button class="nav-btn primary" onclick="nextQ()">Next →</button>'}
      </div>
    </div>
    <div style="text-align:center; margin-top: 20px;">
      <button class="nav-btn" onclick="goHome()" style="font-size:13px; padding: 8px 16px;">Save & Exit</button>
    </div>
  `;
}

function toggleScenario(mtqId, idx) {
  const key = mtqId + ':' + idx;
  const q = QUESTIONS[idx];
  const isFirstOfMtq = idx === 0 || QUESTIONS[idx - 1].mtqId !== q.mtqId;
  const currentlyOpen = state.openScenarios[key] !== undefined ? state.openScenarios[key] : isFirstOfMtq;
  state.openScenarios[key] = !currentlyOpen;
  saveState();
  render();
}

function selectAnswer(label) {
  state.answers[QUESTIONS[state.currentIndex].id] = label;
  saveState();
  render();
}
function setNumericAnswer(val) {
  const q = QUESTIONS[state.currentIndex];
  if (val === '' || val === null) delete state.answers[q.id];
  else state.answers[q.id] = parseFloat(val);
  saveState();
}
function nextQ() {
  if (state.currentIndex < QUESTIONS.length - 1) {
    state.currentIndex++;
    saveState();
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}
function prevQ() {
  if (state.currentIndex > 0) {
    state.currentIndex--;
    saveState();
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}
function goHome() { state.screen = 'start'; saveState(); render(); }

function submitTest() {
  const answered = Object.keys(state.answers).length;
  if (answered < QUESTIONS.length) {
    const skipped = QUESTIONS.length - answered;
    if (!confirm('You have ' + skipped + ' unanswered sub-task' + (skipped > 1 ? 's' : '') + '. Submit anyway?')) return;
  }
  state.screen = 'results';
  saveState();
  render();
}

function isCorrect(q, userAnswer) {
  if (userAnswer === undefined) return false;
  if (q.type === 'mcq' || q.type === 'tf') return userAnswer === q.answer;
  if (q.type === 'numeric') {
    const tolerance = q.tolerance || 0;
    return Math.abs(userAnswer - q.answer) <= tolerance;
  }
  return false;
}

function renderResults(app) {
  let correctCount = 0, wrongCount = 0, skippedCount = 0;
  QUESTIONS.forEach(function(q){
    const ua = state.answers[q.id];
    if (ua === undefined) skippedCount++;
    else if (isCorrect(q, ua)) correctCount++;
    else wrongCount++;
  });
  const pct = Math.round((correctCount / QUESTIONS.length) * 100);

  const grouped = {};
  const groupOrder = [];
  QUESTIONS.forEach(function(q){
    if (!grouped[q.mtqId]) { grouped[q.mtqId] = { name: q.mtqName, items: [] }; groupOrder.push(q.mtqId); }
    grouped[q.mtqId].items.push(q);
  });

  let resultsHTML = '';
  groupOrder.forEach(function(mtqId){
    const g = grouped[mtqId];
    let mtqCorrect = 0;
    g.items.forEach(function(q){
      const ua = state.answers[q.id];
      if (isCorrect(q, ua)) mtqCorrect++;
    });
    resultsHTML += '<div class="result-mtq-group">' +
      '<div class="result-mtq-header">' + escapeHTML(g.name) + ' <span class="result-mtq-summary">— ' + mtqCorrect + '/' + g.items.length + ' correct</span></div>';
    g.items.forEach(function(q){
      const ua = state.answers[q.id];
      const correct = isCorrect(q, ua);
      const skipped = ua === undefined;
      const mark = skipped ? '−' : (correct ? '✓' : '✗');
      const markClass = skipped ? 'skipped' : (correct ? 'correct' : 'wrong');

      let correctAnswerLabel = '';
      if (q.type === 'mcq') {
        const opt = q.options.find(function(o){return o.label === q.answer;});
        correctAnswerLabel = q.answer + ' — ' + (opt ? opt.text.replace(/\n/g, ' ') : '');
      } else if (q.type === 'tf') {
        correctAnswerLabel = q.answer === 'T' ? 'True' : 'False';
      } else if (q.type === 'numeric') {
        correctAnswerLabel = q.answerDisplay;
      }

      let summary;
      if (skipped) summary = 'Not answered';
      else if (q.type === 'mcq') summary = 'Your answer: ' + ua + (correct ? ' ✓' : ' · Correct: ' + q.answer);
      else if (q.type === 'tf') summary = 'Your answer: ' + (ua === 'T' ? 'True' : 'False') + (correct ? ' ✓' : ' · Correct: ' + (q.answer === 'T' ? 'True' : 'False'));
      else summary = 'Your answer: ' + ua.toLocaleString() + (correct ? ' ✓' : ' · Correct: ' + q.answerDisplay);

      const isOpen = state.openResultId === q.id;

      resultsHTML += '<div class="result-item ' + (isOpen ? 'open' : '') + '" id="result-' + q.id + '">' +
        '<div class="result-header" onclick="toggleResult(\'' + q.id + '\')">' +
          '<div class="result-mark ' + markClass + '">' + mark + '</div>' +
          '<div class="result-info">' +
            '<div class="result-title">' + escapeHTML(q.taskLabel) + '</div>' +
            '<div class="result-summary">' + escapeHTML(summary) + '</div>' +
          '</div>' +
          '<div class="result-chevron">▶</div>' +
        '</div>' +
        '<div class="result-body">' +
          '<div style="font-size:14px; padding: 10px 14px; background: var(--bg-soft); border-radius: 6px; margin-bottom: 12px;">' +
            '<strong style="font-size:12px; color: var(--text-muted); text-transform: uppercase; letter-spacing:0.5px;">Scenario recap:</strong>' +
            '<div style="margin-top: 6px;">' + formatText(q.scenario) + '</div>' +
          '</div>' +
          '<div style="font-size:14.5px;">' + formatText(q.text) + '</div>' +
          (!skipped ? '<div class="user-answer-shown"><strong>Your answer:</strong> ' + (q.type === 'mcq' ? ua : (q.type === 'tf' ? (ua === 'T' ? 'True' : 'False') : ua.toLocaleString())) + (correct ? ' ✓ Correct' : ' ✗ Incorrect') + '</div>' : '') +
          '<div class="user-answer-shown"><strong>Correct answer:</strong> ' + escapeHTML(correctAnswerLabel) + '</div>' +
          '<div class="layer solution">' +
            '<h4>Solution — step by step</h4>' +
            '<pre>' + escapeHTML(q.solution) + '</pre>' +
          '</div>' +
          '<div class="layer explanation">' +
            '<h4>Deep explanation</h4>' +
            q.explanation.split('\n\n').map(function(p){return '<p>' + escapeHTML(p).replace(/\n/g, '<br>') + '</p>';}).join('') +
          '</div>' +
          '<div class="layer trap">' +
            '<h4>Trap / Top tip</h4>' +
            q.trap.split('\n\n').map(function(p){return '<p>' + escapeHTML(p).replace(/\n/g, '<br>') + '</p>';}).join('') +
          '</div>' +
        '</div>' +
      '</div>';
    });
    resultsHTML += '</div>';
  });

  app.innerHTML = `
    <header class="banner">
      <h1>Results</h1>
      <div class="sub">${correctCount} correct · ${wrongCount} wrong · ${skippedCount} skipped</div>
    </header>
    <div class="card results-screen">
      <h2>Test Complete</h2>
      <div class="score-display">
        <div class="big">${correctCount}/${QUESTIONS.length}</div>
        <div class="pct">${pct}% correct</div>
      </div>
      <p class="score-line">Click any sub-task below to see the full step-by-step solution, deep tutor explanation, and traps to watch for.</p>
      <div class="results-actions">
        <button class="nav-btn" onclick="reviewMode()">← Back to Questions</button>
        <button class="nav-btn danger" onclick="resetTest()">Start Over</button>
      </div>
    </div>
    <div class="results-list">${resultsHTML}</div>
  `;
}

function toggleResult(id) {
  state.openResultId = state.openResultId === id ? null : id;
  saveState();
  render();
  setTimeout(function(){
    const el = document.getElementById('result-' + id);
    if (el && state.openResultId === id) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 50);
}

function reviewMode() {
  state.screen = 'question';
  state.currentIndex = 0;
  saveState();
  render();
}

loadState();
render();
</script>
</body>
</html>
