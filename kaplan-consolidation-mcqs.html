<script>
const QUESTIONS = [
  {
    id: 'q1', type: 'mcq', topic: 'Goodwill',
    text: "At 1 January 20X4, Yogi acquired 80% of the share capital of Bear for $1,400,000. At that date the share capital of Bear consisted of 600,000 equity shares of $0.50 each and its reserves were $800,000. The fair value of the non-controlling interest was valued at $300,000 at the date of acquisition.\n\nIn the consolidated statement of financial position of Yogi and its subsidiary Bear at 31 December 20X8, what amount should appear for goodwill?",
    options: [{label:'A',text:'$600,000'},{label:'B',text:'$300,000'},{label:'C',text:'$800,000'},{label:'D',text:'$Nil'}],
    answer: 'A',
    solution: "Goodwill = Cost + FV of NCI − FV of net assets at acquisition\n= $1,400,000 + $300,000 − ($300,000 share capital + $800,000 reserves)\n= $1,700,000 − $1,100,000\n= $600,000\n\nShare capital = 600,000 × $0.50 = $300,000 (NOT $600,000).",
    explanation: "Goodwill is calculated at the date of acquisition only — it does NOT change over time (unless impaired). The question gives a 31 December 20X8 reporting date to test whether you wrongly try to update goodwill for post-acquisition movements. Goodwill stays fixed at the acquisition date figure.\n\nThe FV of NCI is given directly ($300,000) so the full goodwill method applies.",
    trap: "Two common mistakes: (1) Using $600,000 for share capital (600,000 × $1) instead of correctly applying the $0.50 nominal value. (2) Trying to update goodwill for post-acquisition movements — goodwill is fixed at the date of acquisition (unless impaired)."
  },
  {
    id: 'q2', type: 'mcq', topic: 'Group Reserves',
    text: "At 1 January 20X8, Tom Co acquired 80% of the share capital of Jerry Co for $100,000. At that date the share capital of Jerry Co consisted of 50,000 equity shares of $1 each and its reserves were $30,000. At 31 December 20X9 the reserves of Tom Co and Jerry Co were as follows:\n\nTom Co: $400,000\nJerry Co: $50,000\n\nWhat amount should appear for group reserves?",
    options: [{label:'A',text:'$400,000'},{label:'B',text:'$438,000'},{label:'C',text:'$416,000'},{label:'D',text:'$404,000'}],
    answer: 'C',
    solution: "Group reserves = Parent's own reserves + Parent's % × Subsidiary's POST-ACQ reserves\n\nJerry's post-acq reserves = $50,000 (now) − $30,000 (at acq) = $20,000\nParent's share = 80% × $20,000 = $16,000\n\nGroup reserves = $400,000 + $16,000 = $416,000",
    explanation: "Only POST-acquisition reserves are split between parent and NCI. Pre-acquisition reserves were already paid for as part of the goodwill calculation — including them would be double-counting.\n\nAt 80% ownership, parent's share of post-acq is 80% (the other 20% belongs to NCI).",
    trap: "Option B ($438,000) wrongly adds 80% of Jerry's FULL current reserves. Option D ($404,000) uses only $5,000 of post-acq. Always: Now − At-acq, then apply parent's %."
  },
  {
    id: 'q3', type: 'mcq', topic: 'Goodwill',
    text: "At 1 January 20X6, Fred Co acquired 75% of the share capital of Barney Co for $65,000. At that date Barney Co's share capital consisted of 20,000 equity shares of $1 each and its reserves were $40,000. The fair value of the non-controlling interest was $20,000 at 1 January 20X6.\n\nWhat amount should appear for goodwill?",
    options: [{label:'A',text:'$45,000'},{label:'B',text:'$15,000'},{label:'C',text:'$25,000'},{label:'D',text:'$5,000'}],
    answer: 'C',
    solution: "Goodwill = Cost + FV of NCI − Net assets at acquisition\n= $65,000 + $20,000 − ($20,000 + $40,000)\n= $85,000 − $60,000\n= $25,000",
    explanation: "Same approach as Q1 — fixed at acquisition date. Share capital here is 20,000 × $1 = $20,000.\n\nThe 31 December 20X9 reporting date is a distractor — goodwill at acquisition doesn't change.",
    trap: "Option A ($45,000) forgets to add FV of NCI. Option B ($15,000) wrongly subtracts FV of NCI instead of adding. Always: Cost + FV of NCI − Net assets. NCI is part of total consideration."
  },
  {
    id: 'q4', type: 'mcq', topic: 'NCI',
    text: "At 1 January 20X6, Gary Co acquired 60% of the share capital of Barlow Co for $35,000. At that date Barlow's share capital consisted of 20,000 equity shares of $1 each and its reserves were $10,000. At 31 December 20X9 reserves were: Gary $40,000; Barlow $15,000. FV of NCI at acquisition was $25,000.\n\nWhat amount should appear for non-controlling interest?",
    options: [{label:'A',text:'$25,000'},{label:'B',text:'$27,000'},{label:'C',text:'$28,000'},{label:'D',text:'$31,000'}],
    answer: 'B',
    solution: "NCI = FV of NCI at acquisition + NCI% × Subsidiary's post-acq reserves\n\nBarlow's post-acq reserves = $15,000 − $10,000 = $5,000\nNCI share = 40% × $5,000 = $2,000\n\nNCI = $25,000 + $2,000 = $27,000",
    explanation: "NCI builds up over time from its starting fair value. Two components: (1) what NCI was worth at acquisition, and (2) NCI's share of any post-acquisition growth in the subsidiary's reserves.\n\nNCI never includes any of the PARENT's reserves.",
    trap: "Option A ($25,000) forgets post-acq build-up. Option C ($28,000) likely uses 60% instead of 40% for NCI share. Always: NCI % = 100% − Parent's %."
  },
  {
    id: 'q5', type: 'mcq', topic: 'NCI',
    text: "At 1 January 20X8, Williams acquired 65% of Barlow for $300,000. Barlow's share capital was 400,000 shares of $0.50 each; reserves $60,000. At 31 December 20X9 reserves were: Williams $200,000; Barlow $75,000. FV of NCI at acquisition was $50,000.\n\nWhat amount should appear for non-controlling interest?",
    options: [{label:'A',text:'$55,250'},{label:'B',text:'$50,000'},{label:'C',text:'$76,250'},{label:'D',text:'$5,250'}],
    answer: 'A',
    solution: "NCI = FV at acq + NCI% × post-acq reserves\n\nBarlow's post-acq reserves = $75,000 − $60,000 = $15,000\nNCI% = 35% (since Williams owns 65%)\nNCI share = 35% × $15,000 = $5,250\n\nNCI = $50,000 + $5,250 = $55,250",
    explanation: "Same NCI formula as Q4 with different numbers. The share capital of $0.50 nominal is a distractor — only the reserves figure matters for the NCI post-acq calculation.",
    trap: "Option B ($50,000) forgets post-acq build-up. Option C ($76,250) wrongly uses 35% × $75,000 (full reserves) instead of post-acq only. Option D ($5,250) is just the post-acq movement portion alone."
  },
  {
    id: 'q6', type: 'mcq', topic: 'Intercompany Balances',
    text: "Extracts from statements of financial position of Dora and Diego ($'000):\n\nInventory: Dora 200 / Diego 100\nReceivables: Dora 540 / Diego 160\nCash: Dora 240 / Diego 80\nPayables: Dora 320 / Diego 180\n\nDora's SOFP includes a receivable of $40,000 due from Diego.\n\nIn the consolidated SOFP what will be the correct amounts for receivables and payables?",
    options: [
      {label:'A',text:'Payables $460,000 / Receivables $660,000'},
      {label:'B',text:'Payables $306,000 / Receivables $660,000'},
      {label:'C',text:'Payables $294,000 / Receivables $694,000'},
      {label:'D',text:'Payables $294,000 / Receivables $654,000'}
    ],
    answer: 'A',
    solution: "Intercompany balance: $40,000 cancels from BOTH sides.\n\nReceivables = 540 + 160 − 40 = $660,000\nPayables = 320 + 180 − 40 = $460,000",
    explanation: "When one group company owes another, both the receivable AND the payable cancel. The group cannot owe itself. Symmetric — same $40,000 cancels on each side.\n\nIf Dora has a $40,000 receivable from Diego, Diego must have a $40,000 payable to Dora.",
    trap: "Common mistake: eliminating on only ONE side. Both sides must be reduced by the same amount. Don't fall for options where only one side is adjusted."
  },
  {
    id: 'q7', type: 'mcq', topic: 'URP',
    text: "Salt owns 70% of Pepper and sold goods to Pepper valued at $1,500 at a mark-up of 20%. 40% of these goods were sold on by Pepper to external parties at the year end.\n\nWhat is the provision for unrealised profit (PURP) adjustment in the group financial statements?",
    options: [{label:'A',text:'$100'},{label:'B',text:'$150'},{label:'C',text:'$240'},{label:'D',text:'$120'}],
    answer: 'B',
    solution: "Mark-up 20% → profit fraction of sale = 20/120 = 1/6\nTotal profit on sale = $1,500 × 1/6 = $250\n\n40% sold externally → 60% still in inventory\n\nURP = $250 × 60% = $150",
    explanation: "Two-step URP: (1) find profit using correct mark-up/margin rule, (2) apply UNSOLD fraction.\n\nThe question gives SOLD fraction (40%). You need 1 − 40% = 60% unsold.\n\nMark-up 20%: cost 100, profit 20, sale 120. Profit fraction of sale = 20/120 = 1/6.",
    trap: "Option C ($240) wrongly treats 20% as margin (profit fraction would be 1/5) and applies wrong logic. Option A ($100) uses 40% sold fraction instead of 60% unsold. ALWAYS: URP is based on UNSOLD goods."
  },
  {
    id: 'q8', type: 'numeric', topic: 'Consolidated NCA',
    text: "Stress acquired 100% of Full on 1 October 20X7 when Full's retained earnings were $300,000. Full's SOFP at 30 September 20X9:\nPPE $1,800k / Current assets $1,000k\nShare capital $1,600k / R.E $500k / Current liabilities $700k\n\nOn 1 October 20X7, the fair value of land within Full's NCA was $400,000 greater than carrying amount. Stress had NCA at 30 September 20X9 at carrying amount $2.2m.\n\nWhat is the total NCA on the consolidated SOFP at 30 September 20X9?\n\nEnter answer in $ (e.g. 4400000):",
    answer: 4400000, tolerance: 0, answerDisplay: "$4,400,000",
    solution: "Consolidated NCA = Stress's NCA + Full's PPE + FV uplift on land\n= $2,200,000 + $1,800,000 + $400,000\n= $4,400,000\n\nLand is not depreciated (indefinite life), so the full $400,000 uplift remains.",
    explanation: "Fair value adjustments at acquisition stay with the asset throughout consolidation. For land specifically, since it has indefinite useful life, the full uplift remains at every reporting date — no depreciation.\n\nIf this had been a building or plant, you'd need to depreciate the uplift over remaining useful life.",
    trap: "Forgetting the FV uplift entirely gives $4,000,000 (wrong). Trying to depreciate land is also wrong. Stress's investment in Full doesn't appear — it was eliminated in goodwill calculation."
  },
  {
    id: 'q9', type: 'mcq', topic: 'URP',
    text: "Hard acquired 80% of Work on 1 April 20X8. During the year Hard sold Work goods for $24m (originally cost $18m). At year-end, Work had sold half to third parties.\n\nWhat is the PURP adjustment for the year ended 31 March 20X9?",
    options: [{label:'A',text:'$1,000,000'},{label:'B',text:'$6,000,000'},{label:'C',text:'$3,000,000'},{label:'D',text:'$7,000,000'}],
    answer: 'C',
    solution: "Total profit on sale = $24m − $18m = $6,000,000\nHalf still unsold → URP = $6,000,000 × 50% = $3,000,000",
    explanation: "When both sale price AND cost are given, just subtract — no mark-up or margin formula needed.\n\nThen apply unsold fraction (half = 50%).\n\nDirection: Hard (parent) was seller, so URP hits parent's R.E only. NCI unaffected.",
    trap: "Option B ($6,000,000) is the TOTAL profit — forgets to apply unsold fraction. Always: total profit × fraction UNSOLD."
  },
  {
    id: 'q10', type: 'mcq', topic: 'NCI Share of Profit',
    text: "Hard acquired 80% of Work on 1 April 20X8. Work's profit for the year was $6,000,000. Hard sold goods to Work for $24m (cost $18m); half remained unsold.\n\nWhat is the total share of group profit attributable to non-controlling interest?",
    options: [{label:'A',text:'$1,200,000'},{label:'B',text:'$4,800,000'},{label:'C',text:'$3,630,000'},{label:'D',text:'$1,440,000'}],
    answer: 'A',
    solution: "NCI's share = NCI% × Work's profit (NO URP adjustment because Hard was seller)\n= 20% × $6,000,000\n= $1,200,000",
    explanation: "URP direction rule: Hard (parent) sold to Work. URP hits parent's R.E only. NCI is NOT affected — the unrealised profit sits in parent's books.\n\nIf Work had been the seller, you'd reduce Work's profit by URP first, then apply NCI%.",
    trap: "Option D ($1,440,000) wrongly tries to ADD URP to NCI share. Option B ($4,800,000) seems to use parent's share. Only S-as-seller URPs flow through NCI. When P sells, NCI is untouched."
  },
  {
    id: 'q11', type: 'mcq', topic: 'Revenue & COS',
    text: "Hard acquired 80% of Work on 1 April 20X8. Revenue: Hard $120m / Work $48m. COS: Hard $84m / Work $40m. Hard sold Work goods for $24m (cost $18m); half remained unsold.\n\nWhat is the total revenue and cost of sales for the consolidated P&L?",
    options: [
      {label:'A',text:'Revenue $144m / COS $100m'},
      {label:'B',text:'Revenue $168m / COS $97.4m'},
      {label:'C',text:'Revenue $192m / COS $100.6m'},
      {label:'D',text:'Revenue $144m / COS $103m'}
    ],
    answer: 'D',
    solution: "Revenue = Hard + Work − intercompany = $120m + $48m − $24m = $144m\n\nCost of sales = Hard + Work − intercompany + URP\n= $84m + $40m − $24m + $3m\n= $103m",
    explanation: "Two adjustments to COS:\n1. Eliminate intercompany sale (subtract)\n2. ADD URP back to COS (this reduces gross profit, correct for unrealised inventory)\n\nWhy add URP to COS? Unsold goods sit in Work's inventory at marked-up price. Adding URP to COS reduces gross profit, properly reflecting the group hasn't made that profit yet.",
    trap: "Option A ($100m COS) forgets URP. Option B has wrong arithmetic. Always: revenue ELIMINATES intercompany sale, COS ELIMINATES sale AND ADDS URP."
  },
  {
    id: 'q12', type: 'numeric', topic: 'Consolidated PPE',
    text: "Really acquired 75% of Hard on 1 January 20X9. Really's PPE = $1,918k. Hard's PPE = $1,960k. Really also acquired 30% of Work (associate). No fair value adjustments.\n\nWhat is the amount for property, plant and equipment to be included in the consolidated SOFP?\n\nEnter answer in $ (e.g. 3878000):",
    answer: 3878000, tolerance: 0, answerDisplay: "$3,878,000",
    solution: "Consolidated PPE = Really's PPE + Hard's PPE\n= $1,918,000 + $1,960,000\n= $3,878,000\n\nWork is an associate (30%) — its PPE is NOT added line by line. Only the equity method 'Investment in associate' single line appears.",
    explanation: "Subsidiaries: full line-by-line consolidation (100% regardless of ownership %).\nAssociates: equity method — single line on SOFP, no individual asset lines added.\n\nThe 30% in Work means Work is an associate. Its PPE figure is irrelevant for line-by-line consolidation.",
    trap: "Don't add Work's PPE at all. Associates NEVER have their individual assets added. Also: don't add only 75% of Hard's PPE — subsidiaries always at 100%."
  },
  {
    id: 'q13', type: 'mcq', topic: 'Group R.E',
    text: "Really acquired 75% of Hard on 1 January 20X9 when Hard had retained LOSSES of $112,000. On 31 December 20X9, Really acquired 30% of Work when Work had retained earnings of $280,000. At year-end: Really's R.E $2,464,000; Hard's R.E $1,204,000.\n\nWhat is the amount for retained earnings on the consolidated SOFP?",

    text: "Tulip acquired 70% of Daffodil on 1 March 20X2. Year ended 31 August 20X2:\nRevenue: Tulip $61,000 / Daffodil $23,000\nCOS: Tulip $(42,700) / Daffodil $(13,800)\nGross profit: Tulip $18,300 / Daffodil $9,200\n\nNo intercompany trading. What should be the consolidated gross profit?\n\nEnter answer in $ (e.g. 22900):",
    answer: 22900, tolerance: 0, answerDisplay: "$22,900",
    solution: "Daffodil acquired 1 March → 6 months post-acq (Mar to Aug)\nDaffodil's post-acq gross profit = $9,200 × 6/12 = $4,600\n\nConsolidated gross profit = Tulip's full GP + Daffodil's post-acq GP\n= $18,300 + $4,600 = $22,900",
    explanation: "When there's no intercompany trade, the only adjustment is time-apportionment for mid-year acquisition.\n\nShortcut: when no other adjustments, time-apportion gross profit directly instead of revenue minus COS separately.",
    trap: "Don't add Daffodil's FULL gross profit ($9,200) — that would give $27,500 which incorrectly includes pre-acquisition profit. Always time-apportion subsidiary results for mid-year acquisitions."
  },
  {
    id: 'q34', type: 'numeric', topic: 'Goodwill + Share Exchange',
    text: "Venus acquired 75% of Mercury's 100,000 $1 equity shares on 1 November 20X4. Consideration: $2 cash per share PLUS 1 Venus share per Mercury share acquired. Venus shares: nominal $1, fair value $1.75. FV of NCI was $82,000. FV of net assets acquired was $215,500.\n\nWhat is goodwill on acquisition?\n\nEnter answer in $ (e.g. 147750):",
    answer: 147750, tolerance: 0, answerDisplay: "$147,750",
    solution: "Mercury shares acquired = 75% × 100,000 = 75,000\n\nCost of investment:\nCash: 75,000 × $2 = $150,000\nShares: 75,000 × 1 × $1.75 = $131,250\nTotal: $281,250\n\nGoodwill = $281,250 + $82,000 − $215,500 = $147,750",
    explanation: "Net assets at acquisition is given directly ($215,500) — saving you the build-up from share capital + R.E + FV adjustments.\n\nFocus on consideration: cash + market value of shares. Always $1.75 (fair value), never $1 (nominal).",
    trap: "Using $1 nominal instead of $1.75 fair value would give cost $225,000 and goodwill $91,500 — WRONG. Always use FAIR VALUE for share exchange consideration."
  },
  {
    id: 'q35', type: 'mcq', topic: 'Associates',
    text: "Which of the following investments of Coffee should be equity accounted in the consolidated financial statements?\n\ni. 40% of the non-voting preference share capital in Tea Co\nii. 18% of the equity share capital in Café Co with two of the five directors of Coffee Co on the board of Café Co\niii. 50% of the equity share capital of Choc Co, with five of the seven directors of Coffee Co on the board of Choc Co",
    options: [{label:'A',text:'i and ii'},{label:'B',text:'ii only'},{label:'C',text:'i and iii'},{label:'D',text:'ii and iii'}],
    answer: 'B',
    solution: "Only (ii) qualifies as an associate.\n\n(i) Non-voting preference shares give NO voting rights → no influence → not associate, not subsidiary.\n\n(ii) 18% equity (below 20% threshold) BUT 2 of 5 directors (40% board representation) → significant influence in substance → associate.\n\n(iii) 50% equity + majority of board (5/7) → CONTROL → subsidiary (full consolidation, NOT equity method).",
    explanation: "Substance over form. The 20-50% threshold is a starting indicator, but the actual test is SIGNIFICANT INFLUENCE, demonstrated by:\n• Board representation\n• Participation in policy-making\n• Material transactions\n• Technical information sharing\n\nLikewise, control isn't just about 50% — board majority can confer control even at 50% equity.",
    trap: "Don't apply % thresholds rigidly. Non-voting shares = no influence regardless of %. Board control trumps simple % rules. Substance over form is core to IAS 28 and IFRS 10."
  },
  {
    id: 'q36', type: 'mcq', topic: 'Associate Theory',
    text: "Consider the following two statements about accounting for associates:\n\n1. Equity accounting will always be used when an investing entity holds between 20%–50% of the equity shares in another entity.\n\n2. Dividends received from an investment in associate will be presented as investment income in the consolidated financial statements.\n\nWhich is TRUE?",
    options: [
      {label:'A',text:'Both statements are true'},
      {label:'B',text:'Only statement 1 is true'},
      {label:'C',text:'Only statement 2 is true'},
      {label:'D',text:'Both statements are false'}
    ],
    answer: 'D',
    solution: "Both statements are FALSE.\n\nStatement 1: NOT always. The 20-50% range is a PRESUMPTION of significant influence, but can be rebutted (e.g. if investor cannot exercise influence in practice). Also, sometimes <20% can be an associate if significant influence is demonstrated through board representation.\n\nStatement 2: NOT correct. Dividends from an associate are NOT shown as investment income. Under equity method, you've already taken your share of the associate's profit. Dividends reduce the investment carrying value (Dr Cash, Cr Investment in associate).",
    explanation: "Two common misconceptions:\n\n1. The 20-50% rule is a PRESUMPTION, not automatic. IAS 28 allows rebuttal in either direction.\n\n2. Different dividend treatments:\n• Simple investment (IFRS 9): dividend → investment income in P&L\n• Associate (equity method): dividend → reduce investment carrying value (no P&L impact)\n\nWhy? Because you've already recognised your share of profits via 'share of profit of associate'.",
    trap: "Statement 1 trips up students who think 20-50% is black-and-white. Statement 2 trips up those who treat all dividends the same way. Different rules apply for different investment types."
  }
];

const STORAGE_KEY = 'consolidation_mcq_state_v1';
let state = { screen: 'start', currentIndex: 0, answers: {}, openResultId: null };

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) state = { ...state, ...JSON.parse(saved) };
  } catch(e) {}
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}
function resetTest() {
  if (!confirm('This will erase your saved progress and answers. Start over?')) return;
  state = { screen: 'start', currentIndex: 0, answers: {}, openResultId: null };
  saveState();
  render();
}

function render() {
  const app = document.getElementById('app');
  if (state.screen === 'start') renderStart(app);
  else if (state.screen === 'question') renderQuestion(app);
  else if (state.screen === 'results') renderResults(app);
}

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

function formatQuestionText(text) {
  const blocks = text.split(/\n\n+/);
  return blocks.map(block => {
    const isData = (block.includes('\n') && (/\s{2,}/.test(block) || (block.match(/\$/g) || []).length >= 3 || /^\s*[\$\d]/m.test(block) || /:\s*\$/.test(block)));
    if (isData) return `<div class="q-data">${escapeHTML(block)}</div>`;
    return `<p style="margin: 0 0 12px;">${escapeHTML(block).replace(/\n/g, '<br>')}</p>`;
  }).join('');
}

function renderStart(app) {
  const answeredCount = Object.keys(state.answers).length;
  const hasProgress = answeredCount > 0;
  app.innerHTML = `
    <header class="banner">
      <h1>Consolidation MCQ Test</h1>
      <div class="sub">ACCA Financial Accounting · ${QUESTIONS.length} questions · No timer · Progress saves automatically</div>
    </header>
    <div class="card start-screen">
      <h2>${hasProgress ? 'Resume Test' : 'Start Test'}</h2>
      <p>
        ${hasProgress
          ? `You've answered <strong>${answeredCount} of ${QUESTIONS.length}</strong> questions. Continue where you left off?`
          : `${QUESTIONS.length} consolidation questions covering goodwill, NCI, URP, intercompany trading, mid-year acquisitions, share exchanges, and associates.`
        }
      </p>
      <p style="font-size:14px; color: var(--text-muted);">
        Click an answer to select. Click "Next" to move on. No instant feedback — full results and explanations appear at the end.<br>
        Progress saves automatically. You can close and reopen anytime.
      </p>
      <div style="margin-top: 30px;">
        <button class="nav-btn primary" onclick="startTest()">${hasProgress ? 'Resume Test' : 'Start Test'}</button>
        ${hasProgress ? '<button class="nav-btn danger" onclick="resetTest()" style="margin-left:10px;">Start Over</button>' : ''}
      </div>
    </div>
  `;
}

function startTest() {
  let firstUnanswered = 0;
  for (let i = 0; i < QUESTIONS.length; i++) {
    if (state.answers[QUESTIONS[i].id] === undefined) { firstUnanswered = i; break; }
    if (i === QUESTIONS.length - 1) firstUnanswered = i;
  }
  state.currentIndex = firstUnanswered;
  state.screen = 'question';
  saveState();
  render();
}

function renderQuestion(app) {
  const q = QUESTIONS[state.currentIndex];
  const progress = ((state.currentIndex + 1) / QUESTIONS.length) * 100;
  const currentAnswer = state.answers[q.id];

  let optionsHTML = '';
  if (q.type === 'mcq') {
    optionsHTML = `<div class="options">${q.options.map(opt => `
      <button class="option ${currentAnswer === opt.label ? 'selected' : ''}" onclick="selectAnswer('${opt.label}')">
        <span class="option-letter">${opt.label}</span>
        <span class="option-text">${escapeHTML(opt.text)}</span>
      </button>`).join('')}</div>`;
  } else if (q.type === 'numeric') {
    const val = currentAnswer !== undefined ? currentAnswer : '';
    optionsHTML = `<div class="numeric-input-wrap">
      <label>Answer ($):</label>
      <input type="number" class="numeric-input" id="numeric-${q.id}" value="${val}" oninput="setNumericAnswer(this.value)" placeholder="Enter number" autocomplete="off">
    </div>`;
  }

  const isLast = state.currentIndex === QUESTIONS.length - 1;
  app.innerHTML = `
    <header class="banner">
      <h1>Consolidation MCQ Test</h1>
      <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
      <div class="progress-text">
        <span>Question ${state.currentIndex + 1} of ${QUESTIONS.length}</span>
        <span>${Object.keys(state.answers).length} answered</span>
      </div>
    </header>
    <div class="card">
      <div class="q-number">
        <span class="tag ${q.type === 'numeric' ? 'numeric' : 'mcq'}">${q.type === 'numeric' ? 'Numeric' : 'MCQ'}</span>
        ${q.topic} · Q${state.currentIndex + 1}
      </div>
      <div class="q-text">${formatQuestionText(q.text)}</div>
      ${optionsHTML}
      <div class="actions">
        <button class="nav-btn" onclick="prevQ()" ${state.currentIndex === 0 ? 'disabled' : ''}>← Previous</button>
        ${isLast ? `<button class="nav-btn primary" onclick="submitTest()">Submit Test →</button>` : `<button class="nav-btn primary" onclick="nextQ()">Next →</button>`}
      </div>
    </div>
    <div style="text-align:center; margin-top: 20px;">
      <button class="nav-btn" onclick="goHome()" style="font-size:13px; padding: 8px 16px;">Save & Exit</button>
    </div>
  `;
}

function selectAnswer(label) {
  state.answers[QUESTIONS[state.currentIndex].id] = label;
  saveState();
  render();
}
function setNumericAnswer(val) {
  const q = QUESTIONS[state.currentIndex];
  if (val === '' || val === null) delete state.answers[q.id];
  else state.answers[q.id] = parseFloat(val);
  saveState();
}
function nextQ() {
  if (state.currentIndex < QUESTIONS.length - 1) { state.currentIndex++; saveState(); render(); }
}
function prevQ() {
  if (state.currentIndex > 0) { state.currentIndex--; saveState(); render(); }
}
function goHome() { state.screen = 'start'; saveState(); render(); }

function submitTest() {
  const answered = Object.keys(state.answers).length;
  if (answered < QUESTIONS.length) {
    const skipped = QUESTIONS.length - answered;
    if (!confirm(`You have ${skipped} unanswered question${skipped > 1 ? 's' : ''}. Submit anyway?`)) return;
  }
  state.screen = 'results';
  saveState();
  render();
}

function isCorrect(q, userAnswer) {
  if (userAnswer === undefined) return false;
  if (q.type === 'mcq') return userAnswer === q.answer;
  if (q.type === 'numeric') {
    const tolerance = q.tolerance || 0;
    return Math.abs(userAnswer - q.answer) <= tolerance;
  }
  return false;
}

function renderResults(app) {
  let correctCount = 0, wrongCount = 0, skippedCount = 0;
  QUESTIONS.forEach(q => {
    const ua = state.answers[q.id];
    if (ua === undefined) skippedCount++;
    else if (isCorrect(q, ua)) correctCount++;
    else wrongCount++;
  });
  const pct = Math.round((correctCount / QUESTIONS.length) * 100);

  const resultsHTML = QUESTIONS.map((q, i) => {
    const ua = state.answers[q.id];
    const correct = isCorrect(q, ua);
    const skipped = ua === undefined;
    const mark = skipped ? '−' : (correct ? '✓' : '✗');
    const markClass = skipped ? 'skipped' : (correct ? 'correct' : 'wrong');
    const correctAnswerLabel = q.type === 'mcq'
      ? `${q.answer} — ${q.options.find(o => o.label === q.answer).text}`
      : q.answerDisplay;
    const summary = skipped ? 'Not answered'
      : (q.type === 'mcq'
        ? `Your answer: ${ua}${correct ? ' ✓' : ` · Correct: ${q.answer}`}`
        : `Your answer: ${ua.toLocaleString()}${correct ? ' ✓' : ` · Correct: ${q.answerDisplay}`}`);
    const isOpen = state.openResultId === q.id;

    return `<div class="result-item ${isOpen ? 'open' : ''}" id="result-${q.id}">
      <div class="result-header" onclick="toggleResult('${q.id}')">
        <div class="result-mark ${markClass}">${mark}</div>
        <div class="result-info">
          <div class="result-title">Q${i + 1}: ${q.topic}</div>
          <div class="result-summary">${escapeHTML(summary)}</div>
        </div>
        <div class="result-chevron">▶</div>
      </div>
      <div class="result-body">
        <div style="font-size:14.5px;">${formatQuestionText(q.text)}</div>
        ${!skipped ? `<div class="user-answer-shown"><strong>Your answer:</strong> ${q.type === 'mcq' ? ua : ua.toLocaleString()}${correct ? ' ✓ Correct' : ' ✗ Incorrect'}</div>` : ''}
        <div class="user-answer-shown"><strong>Correct answer:</strong> ${escapeHTML(correctAnswerLabel)}</div>
        <div class="layer solution">
          <h4>Solution</h4>
          <pre>${escapeHTML(q.solution)}</pre>
        </div>
        <div class="layer explanation">
          <h4>Explanation</h4>
          ${q.explanation.split('\n\n').map(p => `<p>${escapeHTML(p).replace(/\n/g, '<br>')}</p>`).join('')}
        </div>
        <div class="layer trap">
          <h4>Trap / Top Tip</h4>
          ${q.trap.split('\n\n').map(p => `<p>${escapeHTML(p).replace(/\n/g, '<br>')}</p>`).join('')}
        </div>
      </div>
    </div>`;
  }).join('');

  app.innerHTML = `
    <header class="banner">
      <h1>Results</h1>
      <div class="sub">${correctCount} correct · ${wrongCount} wrong · ${skippedCount} skipped</div>
    </header>
    <div class="card results-screen">
      <h2>Test Complete</h2>
      <div class="score-display">
        <div class="big">${correctCount}/${QUESTIONS.length}</div>
        <div class="pct">${pct}% correct</div>
      </div>
      <p class="score-line">Click any question below to see the full solution, deep explanation, and traps to watch for.</p>
      <div class="results-actions">
        <button class="nav-btn" onclick="reviewMode()">← Back to Questions</button>
        <button class="nav-btn danger" onclick="resetTest()">Start Over</button>
      </div>
    </div>
    <div class="results-list">${resultsHTML}</div>
  `;
}

function toggleResult(id) {
  state.openResultId = state.openResultId === id ? null : id;
  saveState();
  render();
  setTimeout(() => {
    const el = document.getElementById(`result-${id}`);
    if (el && state.openResultId === id) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 50);
}

function reviewMode() {
  state.screen = 'question';
  state.currentIndex = 0;
  saveState();
  render();
}

loadState();
render();
</script>
</body>
</html>
